<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 780" width="1440" height="780" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="13" role="img" aria-label="Warden architecture with four trust boundaries: managed instance, warden-core, warden-ui, warden-deadman; Google Cloud services on the right; Firestore as the source of truth at the bottom.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4757"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5fd6"/></marker>
  </defs>
  <rect width="1440" height="780" fill="#ffffff"/>
  <style>
    .tb { fill: #f6f7f9; stroke: #9aa3b1; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .tbl { fill: #6b7686; font-size: 11px; letter-spacing: .06em; }
    .id { fill: #2f5fd6; font-size: 11px; }
    .box { fill: #ffffff; stroke: #1a2130; stroke-width: 1.2; }
    .core { fill: #eef2fb; stroke: #2f5fd6; stroke-width: 1.4; }
    .ext { fill: #ffffff; stroke: #6b7686; stroke-width: 1.2; }
    .t { fill: #1a2130; } .s { fill: #6b7686; font-size: 11px; }
    .e { fill: none; stroke: #3d4757; stroke-width: 1.3; marker-end: url(#a); }
    .eb { fill: none; stroke: #2f5fd6; stroke-width: 1.3; marker-end: url(#ab); }
    .l { fill: #3d4757; font-size: 11px; }
  </style>

  <!-- ===== column 1 ===== -->
  <rect class="tb" x="40" y="150" width="280" height="230" rx="8"/>
  <text class="tbl" x="54" y="170">MANAGED INSTANCE · COMPUTE ENGINE</text>
  <text class="id" x="54" y="186">identity: SA warden-vm — writes only gs://…/jobs/{job}</text>
  <rect class="box" x="60" y="205" width="240" height="150" rx="6"/>
  <text class="t" x="180" y="232" text-anchor="middle" font-weight="600">Harness</text>
  <text class="s" x="180" y="254" text-anchor="middle">wrun — signed RUN_START / RUN_FIN</text>
  <text class="s" x="180" y="272" text-anchor="middle">warden-agent — heartbeat 30 s, mailbox</text>
  <text class="s" x="180" y="290" text-anchor="middle">warden.beat() — step, loss, grad_norm</text>
  <text class="s" x="180" y="308" text-anchor="middle">preempt notice → emergency checkpoint</text>
  <text class="s" x="180" y="326" text-anchor="middle">resume from last intact checkpoint</text>

  <path class="ext" d="M70 470 v70 a10 10 0 0 0 10 10 h200 a10 10 0 0 0 10 -10 v-70" fill="#fff"/>
  <ellipse class="ext" cx="180" cy="470" rx="110" ry="10" fill="#fff"/>
  <text class="t" x="180" y="506" text-anchor="middle" font-weight="600">Cloud Storage</text>
  <text class="s" x="180" y="524" text-anchor="middle">logs · artifacts · RUN_FIN · harness</text>

  <rect class="tb" x="40" y="620" width="280" height="110" rx="8"/>
  <text class="tbl" x="54" y="640">CLOUD RUN · WARDEN-UI</text>
  <text class="id" x="54" y="656">reads Firestore · actions signed to core</text>
  <rect class="box" x="60" y="672" width="240" height="44" rx="6"/><text class="t" x="180" y="699" text-anchor="middle" font-weight="600">Dashboard</text>

  <!-- ===== core ===== -->
  <rect class="tb" x="400" y="130" width="580" height="480" rx="8"/>
  <text class="tbl" x="414" y="150">CLOUD RUN · WARDEN-CORE</text>
  <text class="id" x="414" y="166">identity: SA warden-core — custom role: instances.start / stop / setMetadata · no delete</text>
  <rect class="core" x="430" y="180" width="240" height="46" rx="6"/><text class="t" x="550" y="199" text-anchor="middle" font-weight="600">Ingest</text><text class="s" x="550" y="216" text-anchor="middle">verifies HMAC · stores · never decides</text>
  <rect class="core" x="430" y="250" width="240" height="46" rx="6"/><text class="t" x="550" y="269" text-anchor="middle" font-weight="600">Watcher</text><text class="s" x="550" y="286" text-anchor="middle">deterministic rules · every minute</text>
  <rect class="core" x="430" y="320" width="240" height="46" rx="6"/><text class="t" x="550" y="339" text-anchor="middle" font-weight="600">Incident pipeline</text><text class="s" x="550" y="356" text-anchor="middle">evidence → Gemini → cross-check</text>
  <rect class="core" x="430" y="390" width="240" height="46" rx="6"/><text class="t" x="550" y="409" text-anchor="middle" font-weight="600">Policy engine</text><text class="s" x="550" y="426" text-anchor="middle">pure · L0–L3 · circuit breaker · dry-run</text>
  <rect class="core" x="430" y="460" width="240" height="46" rx="6"/><text class="t" x="550" y="479" text-anchor="middle" font-weight="600">Executor</text><text class="s" x="550" y="496" text-anchor="middle">lease · audit intent / result</text>
  <rect class="core" x="430" y="540" width="240" height="46" rx="6"/><text class="t" x="550" y="559" text-anchor="middle" font-weight="600">Artifact verifier</text><text class="s" x="550" y="576" text-anchor="middle">opens every declared file</text>
  <rect class="core" x="720" y="540" width="230" height="46" rx="6"/><text class="t" x="835" y="559" text-anchor="middle" font-weight="600">Steward</text><text class="s" x="835" y="576" text-anchor="middle">ledger · ETTR · budget kill-switch</text>
  <path class="eb" d="M550 226 V250"/><path class="eb" d="M550 296 V320"/><path class="eb" d="M550 366 V390"/><path class="eb" d="M550 436 V460"/>
  <text class="s" x="740" y="248">read models and write-backs</text>
  <text class="s" x="740" y="265">go through Firestore only;</text>
  <text class="s" x="740" y="282">an LLM session never</text>
  <text class="s" x="740" y="299">outlives one incident step.</text>

  <!-- ===== column 3 ===== -->
  <rect class="ext" x="1020" y="40" width="360" height="56" rx="6"/><text class="t" x="1200" y="62" text-anchor="middle" font-weight="600">Cloud Scheduler</text><text class="s" x="1200" y="80" text-anchor="middle">SA warden-scheduler · OIDC tokens</text>
  <rect class="ext" x="1020" y="180" width="360" height="46" rx="6"/><text class="t" x="1200" y="199" text-anchor="middle" font-weight="600">Billing Budget → Pub/Sub</text><text class="s" x="1200" y="216" text-anchor="middle">thresholds 25 / 50 / 80 / 100 % · OIDC push · dead-letter</text>
  <rect class="ext" x="1020" y="320" width="360" height="46" rx="6"/><text class="t" x="1200" y="339" text-anchor="middle" font-weight="600">Vertex AI · Gemini</text><text class="s" x="1200" y="356" text-anchor="middle">3.5 Flash diagnosis · 3.7 Flash second opinion</text>
  <rect class="ext" x="1020" y="390" width="360" height="46" rx="6"/><text class="t" x="1200" y="409" text-anchor="middle" font-weight="600">Discord</text><text class="s" x="1200" y="426" text-anchor="middle">cards with evidence · Approve / Deny / Always · /warden freeze</text>
  <rect class="ext" x="1020" y="460" width="360" height="46" rx="6"/><text class="t" x="1200" y="479" text-anchor="middle" font-weight="600">Compute Engine API</text><text class="s" x="1200" y="496" text-anchor="middle">start · stop · setMetadata</text>

  <rect class="tb" x="1020" y="620" width="360" height="110" rx="8"/>
  <text class="tbl" x="1034" y="640">CLOUD RUN · WARDEN-DEADMAN</text>
  <text class="id" x="1034" y="656">identity: SA warden-deadman — independent of core</text>
  <rect class="box" x="1040" y="672" width="320" height="44" rx="6"/><text class="t" x="1200" y="691" text-anchor="middle" font-weight="600">Watchdog</text><text class="s" x="1200" y="707" text-anchor="middle">core heartbeat absent 15 min → STOP fleet</text>

  <!-- ===== firestore ===== -->
  <path class="ext" d="M420 660 v56 a10 10 0 0 0 10 10 h520 a10 10 0 0 0 10 -10 v-56" fill="#fff"/>
  <ellipse class="ext" cx="690" cy="660" rx="270" ry="10" fill="#fff"/>
  <text class="t" x="690" y="694" text-anchor="middle" font-weight="600">Firestore — source of truth</text>
  <text class="s" x="690" y="712" text-anchor="middle">fleet · jobs · incidents (state machine) · decisions · evidence · audit (append-only) · costs · health · leases</text>

  <!-- ===== edges ===== -->
  <path class="e" d="M300 203 H430"/><text class="l" x="365" y="218" text-anchor="middle">heartbeat · markers</text>
  <path class="e" d="M430 483 H360 V300 H300"/><text class="l" x="365" y="470" text-anchor="middle">mailbox</text>
  <path class="e" d="M180 355 V460"/><text class="l" x="188" y="412">logs · artifacts · RUN_FIN</text>
  <path class="e" d="M290 563 H430" stroke-dasharray="4 3"/><text class="l" x="365" y="556" text-anchor="middle">fetch + open</text>
  <path class="e" d="M300 694 H420" stroke-dasharray="4 3"/><text class="l" x="360" y="687" text-anchor="middle">reads</text>
  <path class="e" d="M340 672 V590 H400"/><text class="l" x="346" y="640">approve · deny</text><text class="l" x="346" y="654">freeze (HMAC)</text>
  <path class="e" d="M690 610 V650" marker-start="url(#a)"/><text class="l" x="700" y="636">read / write · leases</text>
  <path class="e" d="M1020 68 H960 V130"/><text class="l" x="968" y="118" text-anchor="end">/tick 1 min · /steward 10 min · /digest</text>
  <path class="e" d="M1380 68 H1410 V694 H1360"/><text class="l" x="1404" y="380" text-anchor="end">/check 5 min</text>
  <path class="e" d="M1020 203 H980"/><text class="l" x="1000" y="196" text-anchor="middle">/budget</text>
  <path class="e" d="M670 343 H1020"/><text class="l" x="845" y="336" text-anchor="middle">diagnosis as JSON schema · cited evidence lines</text>
  <path class="e" d="M670 413 H1020" marker-start="url(#a)"/><text class="l" x="845" y="406" text-anchor="middle">proposal · Ed25519-verified decision</text>
  <path class="e" d="M670 483 H1020"/><text class="l" x="845" y="476" text-anchor="middle">operation · requested vs observed</text>
  <path class="e" d="M950 694 H1040" stroke-dasharray="4 3"/><text class="l" x="995" y="687" text-anchor="middle">heartbeat</text>
  <path class="e" d="M1200 672 V506"/><text class="l" x="1208" y="600">STOP all managed instances</text>

  <text class="s" x="40" y="766">Solid = state-changing · Dashed = read-only · HMAC = harness and dashboard traffic · OIDC = Google-signed identity tokens · Ed25519 = Discord interactions</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="13" role="img" aria-label="Warden architecture: managed instances report to warden-core; core decides through rules, Gemini and a policy engine, acts on Compute Engine, records everything in Firestore; the dashboard reads Firestore; an independent watchdog stops the fleet if core goes silent.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4757"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5fd6"/></marker>
  </defs>
  <rect width="1400" height="820" fill="#ffffff"/>
  <style>
    .tb { fill: #f6f7f9; stroke: #9aa3b1; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .tbl { fill: #6b7686; font-size: 11px; letter-spacing: .06em; }
    .id { fill: #2f5fd6; font-size: 11px; }
    .box { fill: #ffffff; stroke: #1a2130; stroke-width: 1.2; }
    .core { fill: #eef2fb; stroke: #2f5fd6; stroke-width: 1.4; }
    .ext { fill: #ffffff; stroke: #6b7686; stroke-width: 1.2; }
    .t { fill: #1a2130; } .s { fill: #6b7686; font-size: 11px; }
    .e { fill: none; stroke: #3d4757; stroke-width: 1.3; marker-end: url(#a); }
    .eb { fill: none; stroke: #2f5fd6; stroke-width: 1.3; marker-end: url(#ab); }
    .l { fill: #3d4757; font-size: 11px; }
  </style>

  <!-- warden-ui -->
  <rect class="tb" x="430" y="20" width="560" height="70" rx="8"/>
  <text class="tbl" x="444" y="40">CLOUD RUN · WARDEN-UI</text>
  <text class="id" x="444" y="56">reads Firestore · forwards operator actions to core, HMAC-signed</text>
  <rect class="box" x="800" y="38" width="160" height="36" rx="6"/><text class="t" x="880" y="61" text-anchor="middle" font-weight="600">Dashboard</text>

  <!-- warden-core -->
  <rect class="tb" x="430" y="130" width="560" height="440" rx="8"/>
  <text class="tbl" x="444" y="150">CLOUD RUN · WARDEN-CORE</text>
  <text class="id" x="444" y="166">identity: SA warden-core — custom role: instances.start / stop / setMetadata · no delete</text>
  <rect class="core" x="460" y="190" width="150" height="56" rx="6"/><text class="t" x="535" y="214" text-anchor="middle" font-weight="600">Watcher</text><text class="s" x="535" y="232" text-anchor="middle">rules, every minute</text>
  <rect class="core" x="650" y="190" width="170" height="56" rx="6"/><text class="t" x="735" y="214" text-anchor="middle" font-weight="600">Incident pipeline</text><text class="s" x="735" y="232" text-anchor="middle">evidence → Gemini → cross-check</text>
  <rect class="core" x="650" y="280" width="170" height="56" rx="6"/><text class="t" x="735" y="304" text-anchor="middle" font-weight="600">Policy engine</text><text class="s" x="735" y="322" text-anchor="middle">pure · L0–L3 · breaker · dry-run</text>
  <rect class="core" x="650" y="370" width="170" height="56" rx="6"/><text class="t" x="735" y="394" text-anchor="middle" font-weight="600">Executor</text><text class="s" x="735" y="412" text-anchor="middle">lease · audit intent / result</text>
  <rect class="core" x="460" y="280" width="150" height="56" rx="6"/><text class="t" x="535" y="304" text-anchor="middle" font-weight="600">Artifact verifier</text><text class="s" x="535" y="322" text-anchor="middle">opens every file</text>
  <rect class="core" x="460" y="370" width="150" height="56" rx="6"/><text class="t" x="535" y="394" text-anchor="middle" font-weight="600">Steward</text><text class="s" x="535" y="412" text-anchor="middle">ledger · ETTR · kill-switch</text>
  <rect class="core" x="460" y="470" width="360" height="56" rx="6"/><text class="t" x="640" y="494" text-anchor="middle" font-weight="600">Ingest</text><text class="s" x="640" y="512" text-anchor="middle">HMAC-verified heartbeats and markers · stores, never decides</text>
  <rect class="core" x="850" y="370" width="120" height="156" rx="6"/><text class="t" x="910" y="396" text-anchor="middle" font-weight="600">Concierge</text><text class="s" x="910" y="416" text-anchor="middle">Discord cards</text><text class="s" x="910" y="432" text-anchor="middle">Approve · Deny</text><text class="s" x="910" y="448" text-anchor="middle">Always · freeze</text><text class="s" x="910" y="476" text-anchor="middle">Ed25519-verified</text><text class="s" x="910" y="492" text-anchor="middle">interactions</text>
  <path class="eb" d="M610 218 H650"/><path class="eb" d="M735 246 V280"/><path class="eb" d="M735 336 V370"/><path class="eb" d="M610 308 H650"/><path class="eb" d="M820 398 H850"/>

  <!-- managed instance -->
  <rect class="tb" x="30" y="250" width="320" height="200" rx="8"/>
  <text class="tbl" x="44" y="270">MANAGED INSTANCE · COMPUTE ENGINE</text>
  <text class="id" x="44" y="286">identity: SA warden-vm — writes only gs://…/jobs/{job}</text>
  <rect class="box" x="60" y="310" width="260" height="110" rx="6"/>
  <text class="t" x="190" y="338" text-anchor="middle" font-weight="600">Harness</text>
  <text class="s" x="190" y="358" text-anchor="middle">wrun · signed RUN_START / RUN_FIN</text>
  <text class="s" x="190" y="376" text-anchor="middle">warden-agent · heartbeat 30 s · mailbox</text>
  <text class="s" x="190" y="394" text-anchor="middle">warden.beat() · step, loss, grad_norm</text>

  <!-- deadman -->
  <rect class="tb" x="1030" y="640" width="340" height="110" rx="8"/>
  <text class="tbl" x="1044" y="660">CLOUD RUN · WARDEN-DEADMAN</text>
  <text class="id" x="1044" y="676">identity: SA warden-deadman — independent of core</text>
  <rect class="box" x="1060" y="690" width="280" height="44" rx="6"/><text class="t" x="1200" y="710" text-anchor="middle" font-weight="600">Watchdog</text><text class="s" x="1200" y="726" text-anchor="middle">core heartbeat absent 15 min → STOP fleet</text>

  <!-- externals, right column -->
  <rect class="ext" x="1090" y="120" width="220" height="60" rx="6"/><text class="t" x="1200" y="143" text-anchor="middle" font-weight="600">Billing Budget → Pub/Sub</text><text class="s" x="1200" y="161" text-anchor="middle">push with OIDC · dead-letter topic</text>
  <rect class="ext" x="1090" y="220" width="220" height="50" rx="6"/><text class="t" x="1200" y="242" text-anchor="middle" font-weight="600">Vertex AI · Gemini</text><text class="s" x="1200" y="260" text-anchor="middle">3.5 Flash · 3.7 Flash (location global)</text>
  <rect class="ext" x="1090" y="360" width="220" height="50" rx="6"/><text class="t" x="1200" y="382" text-anchor="middle" font-weight="600">Compute Engine API</text><text class="s" x="1200" y="400" text-anchor="middle">start · stop · setMetadata</text>
  <rect class="ext" x="1090" y="470" width="220" height="44" rx="6"/><text class="t" x="1200" y="497" text-anchor="middle" font-weight="600">Discord</text>

  <!-- data stores, bottom -->
  <path class="ext" d="M560 630 v56 a10 10 0 0 0 10 10 h260 a10 10 0 0 0 10 -10 v-56" fill="#fff"/>
  <ellipse class="ext" cx="700" cy="630" rx="140" ry="10" fill="#fff"/>
  <text class="t" x="700" y="662" text-anchor="middle" font-weight="600">Firestore — source of truth</text>
  <text class="s" x="700" y="680" text-anchor="middle">fleet · jobs · incidents · decisions · evidence · audit · costs · health · leases</text>
  <path class="ext" d="M90 630 v56 a10 10 0 0 0 10 10 h180 a10 10 0 0 0 10 -10 v-56" fill="#fff"/>
  <ellipse class="ext" cx="190" cy="630" rx="100" ry="10" fill="#fff"/>
  <text class="t" x="190" y="662" text-anchor="middle" font-weight="600">Cloud Storage</text>
  <text class="s" x="190" y="680" text-anchor="middle">logs · artifacts · RUN_FIN · harness</text>
  <rect class="ext" x="60" y="740" width="260" height="50" rx="6"/><text class="t" x="190" y="762" text-anchor="middle" font-weight="600">Cloud Scheduler</text><text class="s" x="190" y="780" text-anchor="middle">SA warden-scheduler · OIDC tokens</text>

  <!-- harness → core -->
  <path class="e" d="M320 340 C 400 340, 400 498, 460 498"/>
  <text class="l" x="330" y="330">POST /ingest · heartbeat + marker (HMAC)</text>
  <path class="e" d="M650 412 C 420 412, 420 400, 320 400"/>
  <text class="l" x="330" y="440">GET /cmd · mailbox (HMAC)</text>
  <path class="e" d="M190 420 V620"/>
  <text class="l" x="198" y="520">logs · artifacts · RUN_FIN</text>
  <path class="e" d="M460 300 H 380 V 600 L 300 640" stroke-dasharray="4 3"/>
  <text class="l" x="388" y="560">fetch + open artifacts</text>
  <!-- scheduler -->
  <path class="e" d="M320 765 C 400 765, 440 600, 448 570"/>
  <text class="l" x="330" y="720">/tick 1 min · /steward 10 min · /digest daily</text>
  <path class="e" d="M320 780 C 700 810, 950 780, 1060 712"/>
  <text class="l" x="660" y="806">/check 5 min</text>
  <!-- core ↔ firestore -->
  <path class="e" d="M700 570 V620" marker-start="url(#a)"/>
  <text class="l" x="710" y="600">read / write · transactional leases</text>
  <!-- dashboard -->
  <path class="e" d="M880 74 V130"/>
  <text class="l" x="890" y="108">approve · deny · freeze</text>
  <path class="e" d="M960 56 H 1010 V 600 L 840 630" stroke-dasharray="4 3"/>
  <text class="l" x="1018" y="590">reads</text>
  <!-- core → externals -->
  <path class="e" d="M820 205 H 1000 C 1040 205, 1050 245, 1090 245"/>
  <text class="l" x="880" y="196">diagnosis · JSON schema</text>
  <path class="e" d="M1090 150 H 1040 V 300 L 990 300"/>
  <text class="l" x="1000" y="292" text-anchor="end">budget thresholds → /budget → kill-switch</text>
  <path class="e" d="M820 380 H 1090"/>
  <text class="l" x="990" y="372">requested vs observed</text>
  <path class="e" d="M970 492 H 1090"/>
  <text class="l" x="990" y="484">cards + buttons</text>
  <!-- deadman -->
  <path class="e" d="M1340 712 H 1360 V 385 L 1310 385"/>
  <text class="l" x="1230" y="600">STOP all managed instances</text>
  <path class="e" d="M1060 700 C 960 700, 900 660, 840 640" stroke-dasharray="4 3"/>
  <text class="l" x="880" y="720">reads core heartbeat</text>

  <text class="s" x="1370" y="808" text-anchor="end">Dashed = read-only · Solid = state-changing · Every boundary uses its own service account</text>
</svg>
